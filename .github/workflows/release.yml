name: Fabriquer l'application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            cmd: dist:win
            files: dist/*.exe
          - os: ubuntu-latest
            cmd: dist:linux
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci installe le ffmpeg propre à chaque système (ffmpeg-static)
      - run: npm ci
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: verif-360-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Vérif 360 ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Téléchargements
            - **Mac Apple Silicon (M1 à M4)** : `verif-360-…-mac-arm64.dmg`
            - **Mac Intel** : `verif-360-…-mac-x64.dmg`
            - **Windows** : `…-windows-installeur.exe` ou `…-windows-portable.exe` (sans installation)
            - **Linux** : `…-linux-x86_64.AppImage` (le rendre exécutable : `chmod +x`)

            Les applications ne sont pas signées par un éditeur reconnu : voir la section *Installation* du README pour le premier lancement.
